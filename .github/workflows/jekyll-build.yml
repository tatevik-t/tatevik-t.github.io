name: Jekyll build

on:
  # Run on pushes to the repository's default branch and allow manual runs
  push:
    branches:
      - master
  workflow_dispatch: {}
  # Keep the existing workflow_run trigger but target the `master` branch
  workflow_run:
    workflows: ["Cleanup bad PR"]
    branches: [master]
    types:
      - completed
      
permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
