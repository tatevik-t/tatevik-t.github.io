name: Jekyll build

on:
  # Run on pushes to the repository's default branch and allow manual runs
  push:
    branches:
      - master
  workflow_dispatch: {}
  # Keep the existing workflow_run trigger but target the `master` branch
  workflow_run:
    workflows: ["Cleanup bad PR"]
    branches: [master]
    types:
      - completed
      
permissions:
  contents: write

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
